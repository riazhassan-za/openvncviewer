name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

# Read-only by default; the build job elevates only what it needs.
permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    # The suite takes well under a minute. Anything approaching this is a hang,
    # and without a bound it burns the timeout on every matrix entry at once.
    timeout-minutes: 8
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Run tests
        env:
          QT_QPA_PLATFORM: offscreen
          PYTHONUNBUFFERED: "1"
        # Unbuffered and verbose so a hang leaves the last test it started
        # visible in the log rather than an empty buffer.
        run: python -X faulthandler -m unittest discover -s tests -t . -v

  build:
    needs: test
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: windows-latest
          # PySide6 publishes a win_arm64 wheel, so this needs no source
          # changes. There is no 32-bit entry and cannot be: PySide6 has never
          # shipped a win32 wheel, and Qt 6 requires Windows 10 regardless.
          - arch: arm64
            runner: windows-11-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          pip install -e .

      - name: Build single-file executable
        run: pyinstaller --noconfirm --clean packaging/openvncviewer.spec

      - name: Name the artifact for its architecture
        run: |
          Move-Item dist/OpenVNCViewer.exe dist/OpenVNCViewer-${{ matrix.arch }}.exe

      - name: Confirm the binary is really ${{ matrix.arch }}
        # A build that silently produced the wrong architecture would look fine
        # until someone downloaded it, so check the PE header rather than trust
        # the runner label.
        shell: python
        run: |
          import struct, sys
          MACHINE = {0x8664: "x64", 0xAA64: "arm64", 0x14C: "x86"}
          path = "dist/OpenVNCViewer-${{ matrix.arch }}.exe"
          with open(path, "rb") as handle:
              handle.seek(0x3C)
              offset = struct.unpack("<I", handle.read(4))[0]
              handle.seek(offset)
              assert handle.read(4) == b"PE\0\0", "not a PE image"
              machine = struct.unpack("<H", handle.read(2))[0]
          found = MACHINE.get(machine, hex(machine))
          print(f"{path}: PE machine = {found}")
          if found != "${{ matrix.arch }}":
              sys.exit(f"expected ${{ matrix.arch }}, built {found}")

      - uses: actions/upload-artifact@v4
        with:
          name: OpenVNCViewer-windows-${{ matrix.arch }}
          path: dist/OpenVNCViewer-${{ matrix.arch }}.exe
          if-no-files-found: error

  release:
    # Separate from build so two parallel architectures cannot race to create
    # the release, and so a tag publishes only once both have succeeded.
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Publish checksums alongside the binaries
        run: |
          cd artifacts
          sha256sum OpenVNCViewer-*.exe | tee SHA256SUMS.txt

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/OpenVNCViewer-*.exe
            artifacts/SHA256SUMS.txt
          body: |
            Unsigned Windows builds. SmartScreen will warn on first run.

            - `OpenVNCViewer-x64.exe` - 64-bit Windows 10 (1809+) or Windows 11
            - `OpenVNCViewer-arm64.exe` - Windows on ARM

            32-bit Windows and Windows 7/8 are not supported: PySide6 ships no
            32-bit wheel, and Qt 6 requires Windows 10.
