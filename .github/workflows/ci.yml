name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

# Read-only by default; the build job elevates only what it needs.
permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    # The suite takes well under a minute. Anything approaching this is a hang,
    # and without a bound it burns the timeout on every matrix entry at once.
    timeout-minutes: 8
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Run tests
        env:
          QT_QPA_PLATFORM: offscreen
          PYTHONUNBUFFERED: "1"
        # Unbuffered and verbose so a hang leaves the last test it started
        # visible in the log rather than an empty buffer.
        run: python -X faulthandler -m unittest discover -s tests -t . -v

  build:
    needs: test
    runs-on: windows-latest
    # Required to create the release and upload the executable to it.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          pip install -e .

      - name: Build single-file executable
        run: pyinstaller --noconfirm --clean packaging/openvncviewer.spec

      - uses: actions/upload-artifact@v4
        with:
          name: OpenVNCViewer-windows-x64
          path: dist/OpenVNCViewer.exe
          if-no-files-found: error

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/OpenVNCViewer.exe
          body: |
            Unsigned Windows x64 build. SmartScreen will warn on first run.
            Requires 64-bit Windows 10 (1809+) or Windows 11.
